name: lint

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -r requirements-dev.txt
      - name: flake8 (PEP 8)
        run: flake8 .
      - name: pytest
        run: pytest -v
